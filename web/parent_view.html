<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krypton — Parent view</title>
  <link rel="icon" href="/ext/icons/logo.svg">
  <link rel="stylesheet" href="/ext/theme.css">
  <script src="/ext/theme-init.js"></script>
  <link rel="stylesheet" href="/ext/app.css">
  <link rel="stylesheet" href="/ext/responsive.css">
  <style>
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .gate .card { width: min(420px, 100%); padding: 28px; }
    .gate h1 { margin: 16px 0 4px; font-size: 26px; }
    .gate .field { margin-top: 12px; }
    .gate .btn-primary { width: 100%; margin-top: 16px; padding: 12px; }
    .msg { margin-top: 10px; font-size: 13px; color: var(--bad); min-height: 18px; }
    .pmain { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; }
    .ptop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpis4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    table { width: 100%; border-collapse: collapse; } td, th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    @media (max-width: 760px) { .kpis4 { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="gate" id="login">
    <form class="card" id="form">
      <div class="brand"><div class="gem"></div>KRYPTON · PARENTS</div>
      <h1>See your child's progress</h1>
      <p class="muted">Enter your child's Krypton username and the parent PIN they set for you in <b>My Marks</b>.</p>
      <div class="field"><label>Child's username</label><input id="u" required autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>Parent PIN</label><input id="p" type="password" inputmode="numeric" required autocomplete="current-password"></div>
      <button class="btn-primary">View progress</button>
      <div class="msg" id="msg"></div>
      <p class="muted small-note"><a href="/login" style="color:var(--accent)">← Student login</a></p>
    </form>
  </section>

  <div class="pmain" id="board" hidden>
    <div class="ptop"><div class="brand big"><div class="gem"></div><span id="who">PARENT VIEW</span></div>
      <button class="btn-ghost" id="out">Log out</button></div>
    <div class="kpis4" id="kpis"></div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><h3>📊 Exam marks</h3><div id="marks"></div></div>
      <div class="card"><h3>🎯 Weak chapters</h3><div id="weak"></div></div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><h3>📅 School events</h3><div id="events"></div></div>
      <div class="card"><h3>📝 Notes from teachers</h3><div id="reports"></div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>🏆 Badges earned</h3><div id="badges" class="muted"></div></div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let token = null;
  try { token = sessionStorage.getItem("krypton.parentview"); } catch (e) { /* ignore */ }

  async function load() {
    const r = await fetch("/parent-api/overview", { headers: { "X-Parent-View": token || "" } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Please log in again.");
    const d = await r.json();
    $("login").hidden = true; $("board").hidden = false;
    const p = d.profile || {}, g = d.game, recs = d.records || [];
    $("who").textContent = `${(p.name || d.student.name || d.student.username).toUpperCase()} · CLASS ${p.cls || d.student.cls || "?"}`;
    const avg = recs.length ? Math.round(recs.reduce((s, x) => s + x.marks / x.max_marks * 100, 0) / recs.length) + "%" : "—";
    $("kpis").innerHTML = [[`Lv ${g.level}`, g.title], [`🔥 ${g.streak}`, "day streak"], [g.xp, "total XP"], [avg, "average exam score"]]
      .map(([b, s]) => `<div class="kpi"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
    $("marks").innerHTML = recs.length ? `<table><tr><th>Exam</th><th>Subject</th><th>Marks</th><th>%</th></tr>${recs.slice().reverse().map(x =>
      `<tr><td>${esc(x.exam)}</td><td>${esc(x.subject)}</td><td>${x.marks}/${x.max_marks}</td><td>${Math.round(x.marks / x.max_marks * 100)}%</td></tr>`).join("")}</table>`
      : `<p class="muted">No marks added yet.</p>`;
    const weak = d.review.weak || [];
    $("weak").innerHTML = weak.length ? weak.map(w => `<div class="deckrow"><span><b>${esc(w.title)}</b><br><span class="muted small-note">${esc(w.subject)} · ${w.wrong} wrong of ${w.total}</span></span><b>${w.accuracy}%</b></div>`).join("")
      + `<p class="muted small-note">${d.review.due_count} revision card(s) due today.</p>` : `<p class="muted">No weak chapters yet.</p>`;
    const s = d.school, when = e => e.days_left === 0 ? "today" : e.days_left === 1 ? "tomorrow" : `in ${e.days_left} days`;
    $("events").innerHTML = s.events.length ? s.events.map(e => `<div class="deckrow"><span>${e.remind ? "🔔 " : ""}<b>${esc(e.title)}</b><br>
      <span class="muted small-note">📅 ${esc(e.date)} ${esc(e.time || "")} · ${when(e)}</span>${e.description ? `<br><span class="small-note">${esc(e.description)}</span>` : ""}</span></div>`).join("")
      : `<p class="muted">No upcoming events.</p>`;
    $("reports").innerHTML = s.reports.length ? s.reports.map(x => `<div class="deckrow"><span><b>${esc(s.categories[x.category] || x.category)}</b> · ${esc(x.area)}
      <br><span class="small-note">${esc(x.note)}</span><br><span class="muted small-note">${esc(x.date)} · ${esc(x.by)}</span></span></div>`).join("")
      : `<p class="muted">No notes from teachers.</p>`;
    const earned = g.badges.filter(b => b.earned);
    $("badges").innerHTML = earned.length ? earned.map(b => `${b.icon} <b>${esc(b.name)}</b>`).join(" &nbsp; ") : "No badges yet.";
  }

  $("form").onsubmit = async e => {
    e.preventDefault();
    $("msg").textContent = "";
    try {
      const r = await fetch("/parent-api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("u").value, pin: $("p").value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "Couldn't log in.");
      token = d.token;
      try { sessionStorage.setItem("krypton.parentview", token); } catch (er) { /* ignore */ }
      await load();
    } catch (err) { $("msg").textContent = err.message; }
  };
  $("out").onclick = () => { try { sessionStorage.removeItem("krypton.parentview"); } catch (e) { /* ignore */ } location.reload(); };
  if (token) load().catch(() => {});
</script>
</body>
</html>
